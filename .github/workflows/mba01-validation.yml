name: MBA-PORT-001 | Verify restaurant case
on:
  push:
    paths:
      - 'case-studies/mba-port-001/**'
      - '.github/workflows/mba01-validation.yml'
  pull_request:
    paths:
      - 'case-studies/mba-port-001/**'
      - '.github/workflows/mba01-validation.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    defaults:
      run:
        working-directory: case-studies/mba-port-001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source integrity
        run: python tools/verify_manifest.py
      - name: Recalculate financial scenarios
        run: python -m src.restaurant_case --check-anchors
      - name: Check operational controls
        run: python -m src.operational_controls
      - name: Test all business cases
        run: python -m unittest discover -s tests -v
      - name: Check regenerated outputs
        run: git diff --exit-code -- outputs/
